<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоматология — тест</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     margin:0;padding:16px;background:#f2f4f8;color:#1a1a1a;line-height:1.5}
.container{max-width:820px;margin:0 auto}
.header{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;
        box-shadow:0 1px 4px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.header h1{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.header h1 .back{margin-left:auto;font-size:13px;font-weight:500;color:#4a7dff;
                 background:none;border:none;cursor:pointer;padding:4px 8px}
.header h1 .back:hover{text-decoration:underline}
.progress{height:8px;background:#e6e8ec;border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;background:#4a7dff;width:0;transition:width .3s}
.stat{display:flex;justify-content:space-between;font-size:13px;color:#666;gap:8px;flex-wrap:wrap}
.menu{background:#fff;border-radius:12px;padding:24px 20px;
      box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.menu h2{margin:0 0 6px;font-size:20px}
.menu p{margin:0 0 18px;font-size:14px;color:#666}
.menu-section{margin-bottom:20px}
.menu-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;
                 color:#888;margin:0 0 10px;font-weight:600}
.mode-btn{display:block;width:100%;text-align:left;padding:14px 16px;
          border:2px solid #e6e8ec;border-radius:10px;background:#fff;
          font-family:inherit;font-size:15px;color:#1a1a1a;cursor:pointer;
          margin-bottom:8px;transition:all .15s;font-weight:500}
.mode-btn:hover{border-color:#4a7dff;background:#f5f8ff}
.mode-btn .sub{display:block;font-size:12.5px;color:#888;
               font-weight:400;margin-top:3px}
.mode-btn.primary{background:#4a7dff;color:#fff;border-color:#4a7dff}
.mode-btn.primary:hover{background:#3a6ae0}
.mode-btn.primary .sub{color:#cfdcff}
.blocks-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:600px){.blocks-grid{grid-template-columns:1fr 1fr 1fr}}
.block-btn{padding:10px 12px;border:2px solid #e6e8ec;border-radius:10px;
           background:#fff;font-family:inherit;font-size:13.5px;
           color:#1a1a1a;cursor:pointer;transition:all .15s;font-weight:500}
.block-btn:hover{border-color:#4a7dff;background:#f5f8ff}
.block-btn .sub{display:block;font-size:11.5px;color:#888;
                font-weight:400;margin-top:2px}
.card{background:#fff;border-radius:12px;padding:18px;
      box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.q-head{font-size:13px;color:#4a7dff;font-weight:600;margin-bottom:8px}
.q-text{font-size:15px;white-space:pre-wrap;margin-bottom:14px;word-wrap:break-word}
.option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;
        border:2px solid #e6e8ec;border-radius:10px;margin-bottom:8px;
        cursor:pointer;transition:all .15s;user-select:none}
.option:hover{border-color:#4a7dff;background:#f5f8ff}
.option.selected{border-color:#4a7dff;background:#f0f4ff}
.option.correct{border-color:#22a06b;background:#e8f7f0}
.option.wrong{border-color:#d9534f;background:#fceceb}
.option input{display:none}
.option .marker{width:22px;height:22px;border:2px solid #ccc;border-radius:50%;
                flex-shrink:0;display:flex;align-items:center;justify-content:center;
                font-size:12px;color:#999;font-weight:700}
.option.cb .marker{border-radius:6px}
.option.selected .marker{border-color:#4a7dff;color:#4a7dff}
.option.correct .marker{border-color:#22a06b;background:#22a06b;color:#fff}
.option.wrong .marker{border-color:#d9534f;background:#d9534f;color:#fff}
.match-row{display:grid;grid-template-columns:1fr auto;gap:10px;
           padding:8px 0;align-items:center;border-bottom:1px solid #eef0f4}
.match-left{font-size:14px;word-wrap:break-word}
.match-left b{color:#4a7dff;margin-right:6px}
.match-select{padding:8px 10px;border:2px solid #e6e8ec;border-radius:8px;
              font-size:14px;font-family:inherit;min-width:70px;background:#fff}
.match-select:focus{outline:none;border-color:#4a7dff}
.match-select.correct{border-color:#22a06b;background:#e8f7f0}
.match-select.wrong{border-color:#d9534f;background:#fceceb}
.rights-list{margin-top:14px;padding:12px;background:#f8f9fb;border-radius:10px;
             font-size:13.5px}
.rights-list .hint-title{font-weight:600;margin-bottom:6px;color:#4a7dff}
.rights-list div{padding:3px 0;line-height:1.4}
.rights-list b{color:#4a7dff;margin-right:6px}
.text-input{width:100%;padding:10px 12px;font-size:15px;border:2px solid #e6e8ec;
            border-radius:10px;font-family:inherit;min-height:44px}
.text-input:focus{outline:none;border-color:#4a7dff}
textarea.text-input{min-height:80px;resize:vertical}
.hint{font-size:13px;color:#666;margin-bottom:8px;padding:8px 10px;
      background:#f8f9fb;border-radius:8px}
button.nav-btn{padding:10px 18px;border:none;border-radius:10px;font-size:15px;
       cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:#4a7dff;color:#fff}
.btn-primary:hover{background:#3a6ae0}
.btn-secondary{background:#e6e8ec;color:#333}
.btn-secondary:hover{background:#d5d8de}
button:disabled{opacity:.5;cursor:not-allowed}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;
          font-size:14px;display:none;white-space:pre-wrap}
.feedback.show{display:block}
.feedback.ok{background:#e8f7f0;color:#166b46;border-left:4px solid #22a06b}
.feedback.bad{background:#fceceb;color:#8b2622;border-left:4px solid #d9534f}
.feedback b{font-weight:600}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.finish{background:#fff;border-radius:12px;padding:32px 20px;text-align:center;
        box-shadow:0 1px 4px rgba(0,0,0,.06)}
.finish h2{margin-top:0}
.finish .big{font-size:38px;font-weight:700;color:#4a7dff}
.finish .sub{margin:8px 0 20px;color:#666}
.finish .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="container">
    <div id="header"></div>
    <div id="root"></div>
</div>

<script>
const DATA = [{"q": "Укажите правильную последовательность этапов обследования пациента в стоматологии\nЭтапы:\nА. Сбор анамнеза (жалобы, история заболевания)\nБ. Внешний осмотр лица и шеи\nВ. Осмотр полости рта (слизистая, зубы, десны)\nГ. Пальпация лимфоузлов и мягких тканей\nД. Перкуссия зубов\nЕ. Зондирование кариозных полостей\nЖ. Постановка предварительного диагноза", "a": "А, Б, В, Г, Д, Е, Ж", "num": 1}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nОтчетно-учетная и финансовая документация стоматолога- ортопеда\nА. медицинская карта или история болезни\nБ. листок ежедневного учета работы врача-стоматолога-ортопеда, форма № 37/У\nВ. листок ежедневного учета работы стоматолога-ортопеда в трудовых единицах\nГ. дневник учета работы врача-стоматолога-ортопеда, форма № 039-4/У", "a": "Б, В, Г", "num": 2}, {"q": "Прочитайте текст и запишите ответ\nОсновной медицинский документ, который составляется на каждого поступившего в хирургический кабинет больного__________", "a": "амбулаторная карта", "num": 3}, {"q": "Укажите правильную последовательность жалоб пациента при заболевании пульпы зуба:\nА. иррадиация боли\nБ. приступообразная ночная боль\nВ. самопроизвольная боль\nГ. приступообразная со светлыми промежутками", "a": "В, Г, Б, А", "num": 4}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nПульпе зуба человека присущи следующие функции:\nА. Дентинообразующая;\nБ. Трофико-сенсорная;\nВ. Защитная;\nГ. Кроветворная;", "a": "А, Б, В", "num": 5}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nНеправильный эндодонтический доступ приведет к\nА. пропуску корневых каналов\nБ. сепарации инструмента\nВ. перелому корня\nГ. неадекватному обезболиванию", "a": "А, Б", "num": 6}, {"q": "Прочитайте текст и запишите ответ\nЕсли раздражающие факторы не устранены и у пульпы ослаблены защитно-компенсаторные механизмы, то развивается", "a": "воспаление", "num": 7}, {"q": "Прочитайте текст и запишите ответ\nОбласть стоматологии, изучающая морфологию, физиологию и патологию пульпы зубов человека и тканей, окружающих корень зуба", "a": "эндодонтия", "num": 8}, {"q": "Последовательность медикаментозной терапии при обострении хронического пародонтита\nУстановите правильный порядок:\nА. Антисептические полоскания (0,05% хлоргексидин)\nБ. Аппликации противовоспалительного геля\nВ. Системная антибиотикотерапия\nГ. Физиотерапевтические процедуры\nД. Контроль эффективности лечения", "a": "А, Б, В, Г, Д", "num": 9}, {"q": "Прочитайте текст и запишите ответ\n_______________это комплекс тканей, состоящий из периодонтальной связки, цемента, десны и альвеолярной кости.", "a": "пародонт", "num": 10}, {"q": "Прочитайте текст и запишите ответ\nДесна, покрывающая альвеолярный отросток - это", "a": "альвеолярная десна", "num": 11}, {"q": "Прочитайте текст и запишите ответ\n_______________это воспалительное поражение окружающих тканей зуба, приводящее к нарушению и ослаблению связочного аппарата зуба", "a": "пародонтит", "num": 12}, {"q": "Прочитайте текст и запишите ответ\n_______________это стоматологическое заболевание, возникающее при наличии металлических зубных протезов и вследствие их взаимодействия со слюной, являющейся сложным электролитом", "a": "гальваноз", "num": 13}, {"q": "Прочитайте текст и запишите ответ\n______это хирургические манипуляции, к которым прибегают для того, чтобы убрать поддесневые отложения или очистить лунку после удаления зуба.", "a": "кюретаж", "num": 14}, {"q": "Прочитайте текст и установите последовательность\nЭтапы препарирования кариозной полости:\nА. «раскрытие» кариозной полости\nБ. некрэктомия (удаление размягченного и пигментированного дентина);\nВ. финирование (обработка) краев полости\nГ. обезболивание\nД. расширение полости\nЕ. формирование полости", "a": "Г, А, Д, Б, Е, В", "num": 15}, {"q": "Выберите один вариант ответа\nКариесогенные зоны верхних боковых резцов – это.\nА. эмалевые валики\nБ. эмалевые бороздки\nВ. режущие края\nГ. слепые ямки", "a": "Г", "num": 16}, {"q": "Прочитайте текст и запишите ответ\n_______рыхлая соединительная ткань, заполняющая полость зуба", "a": "пульпа", "num": 17}, {"q": "Прочитайте текст и запишите ответ\nОценивая качество полученной рабочей модели, особое внимание уделяют точности отображения __________ борозды", "a": "зубодесневой", "num": 18}, {"q": "Вместо прочерка впишите только одно слово:\nЗубная бляшка — это скопление бактерий, которые плотно фиксированы на поверхности зуба и при определенных условиях способны создать на ограниченном участке _______ среду, достаточную для деминерализации эмали.", "a": "кислую", "num": 19}, {"q": "Вместо прочерка впишите только одно слово:\nПатологический процесс в твердых тканях зуба, возникающий после прорезывания зубов и заключающийся в очаговой деминерализации эмали с последующим образованием полости называют _______", "a": "кариес", "num": 20}, {"q": "Вместо прочерка впишите только одно слово:\nСуммарный результат процессов де- и реминерализации с преобладанием деминерализации, приводящий к потере минералов, растворению твердых тканей зуба и к образованию кариозного поражения-________ процесс.", "a": "кариозный", "num": 21}, {"q": "Выберите один вариант ответа\nПосле прорезывания зуба возникает\n1) гипоплазия эмали;\n2) флюороз;\n3) перелом коронки в результате травмы;\n4) несовершенный амелогенез;\n5) тетрациклиновое окрашивание.", "a": "3", "num": 22}, {"q": "Выберите один вариант ответа\nДентин при активном течении кариеса\n1) светлый, влажный, легко удаляется экскаватором;\n2) светлый, влажный, удаляется экскаватором с трудом;\n3) пигментированный, легко удаляется экскаватором;\n4) пигментированный, удаляется экскаватором с трудом;\n5) светлый, при зондировании плотный.", "a": "1", "num": 23}, {"q": "Выберите один вариант ответа\nПоказанием к лечению пульпита методом витальной ампутации является\n1) отлом коронки зуба с обнажением пульпы в первые 48 ч. после травмы;\n2) отлом коронки зуба с обнажением пульпы спустя 48 ч. после травмы;\n3) хронический гангренозный пульпит в постоянном однокорневом зубе с несформированным корнем;\n4) все формы пульпита во временных молярах независимо от стадии формирования корня;\n5) все формы пульпита во временных однокорневых зубах со сформированными корнями.", "a": "1", "num": 24}, {"q": "Выберите один вариант ответа\nПри выборе метода лечения кариеса у детей необходимо учитывать\n1. активность процесса.\n2. распространенность кариеса.\n3. состояние гигиены полости рта.\n4. возраст ребенка.\n5. вредные привычки.", "a": "1", "num": 25}, {"q": "Выберите один вариант ответа\nДополнительным методом исследования при диагностике анкилоза височно-нижнечелюстного сустава является\nа) миография\nб) аудиометрия\nв) биохимия крови\nг) компьютерная томография\nд) электроодонтодиагностика", "a": "г", "num": 26}, {"q": "Выберите один вариант ответа\nМетодами забора материала для цитологического исследования являются\nа) пункционный\nб) аспирационный\nв) соскоб\nг) мазок, отпечаток\nд) все вышеперечисленные", "a": "д", "num": 27}, {"q": "При выборе конструкции мостовидного протеза учитывают: (два правильных ответа)\n1.абсолютную силу жевательных мышц, величину дефекта зубного ряда\n2.величину дефекта зубного ряда, состояние пародонта опорных зубов\n3.состояние пародонта опорных зубов, жевательную эффективность\n4.жевательную эффективность, топографию дефекта зубного ряда\n5.топографию дефекта зубного ряда, абсолютную силу жевательных мышц", "a": "2, 5", "num": 28}, {"q": "Установите соответствие групп микропротезов\n1 | включаются внутрь твердых тканей | А | –overlay\n2 | покрывают окклюзионную поверхность и одновременно входящие в твердые ткани на различную глубину | Б | –pinlay\n3 | охватывают снаружи большую часть зуба | В | –inlay\n4 | любые микропротезы первых трех групп, которые дополнительно укрепляются в корневой ткани с помощью штифта | Г | –onlay", "a": "1-в, 2-г, 3-а, 4-б", "num": 29}, {"q": "Установите соответствие оттискных масс согласно классификации И.М.Оксмана:\n1 | термопластические | А | АКР-100, стиракрил, дуракрил\n2 | эластические | Б | гипс и эвгенол-оксицинковая паста «Репин»\n3 | кристаллизующиеся | В | альгеласт, стомальгин,\n4 | полимеризующиеся | Г | гуттаперча, стене и массы Вайнштейна", "a": "1-г, 2-в, 3-б, 4-а", "num": 30}, {"q": "Воспалительную резорбцию альвеолярной перегородки определяют в результате:\n1. зондирования пародонтального кармана\n2. реографического исследования тканей пародонта\n3. рентгенологического исследования челюстных костей\n4. эхоостеометрического исследования альвеолярной кости\n5. определения индексов кровоточивости десны при зондировании", "a": "3", "num": 31}, {"q": "Локализованную форму периодонтита (как осложнения) может вызвать: (два правильных ответа)\n1.обильные зубные отложения\n2.перегрузка отдельных зубов при аномалиях прикуса\n3.положения и формы отдельных зубов\n4.нависающие края пломб", "a": "2, 3", "num": 32}, {"q": "Выберите один вариант ответа\nНе изолированный торус верхней челюсти…\nДайте определения понятию «Торус»:\n1) нарушает стабилизацию протеза\n2) не влияет на стабилизацию протеза\n3) улучшает стабилизацию протеза челюсти\n4) ведет к поломке протеза", "a": "4", "num": 33}, {"q": "Костный выступ в области срединного небного шва на верхней челюсти- это", "a": "торус", "num": 34}, {"q": "Аппарат Дерихсвайлера относится к:\n1. ретенционным\n2. профилактическим\n3. лечебным съемным\n4. лечебным несъемным", "a": "4", "num": 35}, {"q": "Прочитайте текст, укажите правильный ответ и запишите аргументы, обосновывающие выбор ответа\nПо механизму действия аппарат Шварца\n1. функциональный действующий\n2. комбинированый\n3. механический действующий\n4. сочетанный", "a": "3", "num": 36}, {"q": "Анализ работы врача ортодонта целесообразно проводить с учетом количества\nа) посещений больных\nб) примененных ортодонтических аппаратов\nв) вылеченных детей\nг) трудовых единиц\nд) детей, взятых на ортодонтическое лечение", "a": "В", "num": 37}, {"q": "Положение нижней челюсти у новорожденного ст, укажите правильный ответ\nПЦР с обратной транскрипцией целесообразно использовать для:\nА. Диагностики заболеваний, вызванных РНК-вирусами\nБ. Диагностики бактериальных заболеваний\nВ. Диагностики гельминтных инвазий", "a": "А", "num": 132}, {"q": "Установите правильный порядок этапов стерилизации стоматологических инструментов.\nА. Предварительная дезинфекция\nБ. Контроль качества стерилизации\nВ. Предстерилизационная очистка\nГ. Собственно стерилизация", "a": "А-Г-Б-В", "num": 133}, {"q": "12. Выберите один вариант ответа\nВид микроорганизмов это:\nА. совокупность особей, имеющих единый генотип, который в стандартных условиях проявляется сходными биологическими признаками\nБ. популяция микроорганизмов, выделенная из различных объектов или одного источника в разное время, обладающая сходными биологическими признаками\nВ. совокупность особей, являющаяся потомством одной микробной клетки)", "a": "А", "num": 134}, {"q": "Выберите один вариант ответа\nСовокупность биологических процессов, которые могут наблюдаться или отсутствовать при проникновении патогенного или условно-патогенного микроорганизма в макроорганизм:\nА. колонизация\nБ. инфекция\nВ. фагоцитоз\nГ. пенетрация\nД. эндоцитоз", "a": "Б", "num": 135}, {"q": "Выберите один вариант ответа\nПовторное заражение организма возбудителем, вызвавшим ранее перенесенное инфекционное заболевание:\nА. реинфекция\nБ. рецидив\nВ. смешанная инфекция\nГ. суперинфекция\nД. аутоинфекция", "a": "А", "num": 136}, {"q": "Выберите один вариант ответа\nАнтагонисты кариесогенной микрофлоры\nА. оральные стрептококки\nБ. пептострептококки\nВ. вейлонеллы\nГ. фузобактерии", "a": "В", "num": 137}, {"q": "Прочитайте текст и запишите ответ\nВ кишечнике практически здоровых людей должны преобладать следующие микроорганизмы _______", "a": "анаэробные", "num": 138}, {"q": "Прочитайте текст и запишите ответ\nИнгибирование синтеза клеточной стенки характерно для________________", "a": "ампициллина", "num": 139}, {"q": "Прочитайте текст и зап 0-неорганических, 30-40 органических, 10-20 воды\nв) 70-неорганических, 25 органических, 5 воды\nг) 70-неорганических, 20 органических, 10 воды", "a": "а", "num": 244}, {"q": "Укажите один правильный ответ.\n1. Телескопическими системами крепления съемных протезов являются\n1) кламмеры\n2) телескопические коронки\n3) замковые соединения\n4) балочные системы\n5) магниты\n6) 1,2,3,4,5\n7) 2,3,4", "a": "7", "num": 245}, {"q": "Выберите один вариант ответа\nПоказаниями для использования замковой системы в съемном протезе являются\n1) высота опорного зуба не менее 5мм\n2) атрофия лунки опорного зуба на 2/3 длины корня\n3) достаточный переднезадний размер опорного зуба\n4) хорошая гигиена полости рта\n5) возможность пациента посещать врача для контрольных осмотров\n6) 1,3,4,5\n7) 1,3,5", "a": "6", "num": 246}, {"q": "Выберите один вариант ответа\nТелескопические коронки чаще используются\n1) на нижней челюсти при одиночно стоящих зубах\n2) при подвижности опорных зубов первой степени\n3) при низких клинических коронках опорных зубов\n4) при неблагоприятной форме протезного ложа\n5) 1,2,3,4\n6) 1,2,4", "a": "6", "num": 247}, {"q": "Выберите один вариант ответа\nКакое направление кламмерной линии предпочтительно на нижней челюсти?\n1) трансверсальное\n2) сагиттальное\n3) диагональное", "a": "1", "num": 248}, {"q": "Выберите один вариант ответа\nХарактерные жалобы при аллергическом стоматите, возникшем в связи с пользованием протезами из акриловых пластмасс:\n1) жжение языка, щек, губ\n2) затрудненные дыхание, глотание\n3) жжение и воспаление слизистой оболочки полости рта, наиболее выраженные под протезом\n4) верно 1), 2) и 3)", "a": "4", "num": 249}, {"q": "Выберите один вариант ответа\nНа органический состав смазанного слоя корневого канала можно воздействовать, используя:\n1) дистиллированную воду\n2) Паркан 3%\n3) раствор Хлоргексидина 0,05%\n4) физиологический раствор", "a": "2", "num": 250}, {"q": "Выберите один вариант ответа\nКакие дополнительные методы исследования ого материала за верхушечное отверстие корня является:\nА. перфорация стенки корневого канала\nБ. избыточное расширение апикального отверстия\nВ. облом стержневого инструмента в канале\nГ. недостаточная медикаментозная обработка\nД. плохо высушенный канал", "a": "Б", "num": 258}, {"q": "Выберите один вариант ответа\nРезекция верхушки корня - это:\nА. рассечение моляров нижней челюсти на две части по бифуркации\nБ. отсечение верхушки корня и удаление патологически измененных тканей\nВ. удаление корня вместе с прилежащей к нему коронковой частью зуба\nГ. удаление всего корня до места его отхождения без удаления коронковой части\nД. удаление с последующим пломбированием и возвратом зуба в лунку", "a": "Б", "num": 259}, {"q": "Выберите один вариант ответа\nМеханической травмой пульпы не может быть:\nА. бытовая травма\nБ. перемещение зубов при ортодонтическом лечении\nВ. случайное вскрытие полости зуба во время препарирования\nГ. длительная стрессовая ситуация", "a": "Г", "num": 260}, {"q": "Выберите один вариант ответа\nФункции пародонта:\nА. барьерная, рефлекторная, трофическая, пластическая, амортизирующая\nБ. барьерная, амортизирующая\nВ. барьерная, рефлекторная, трофическая\nГ. рефлекторная, амортизирующая\nД. пластическая, рецепторная, сенсорная", "a": "А", "num": 261}, {"q": "Выберите один вариант ответа\nСообщение кариозной полости с полостью зуба является симптомом:\nА. острого пульпита\nБ. кариеса дентина\nВ. острого периодонтита\nГ. хронического пульпита\nД. некариозных поражений", "a": "Г", "num": 262}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nИз микроорганизмов при пульпите основную роль приписывают:\nА. актиномицетам\nБ. стрептококкам\nВ. стафилококкам\nГ. пневмококкам\nД. лактобациллам", "a": "Б, В, Д", "num": 263}, {"q": "Прочитайте текст и запишите ответ\nПульпа является соединительной тканью, окруженной ____________, который ограничивает возможность расширения пульпы.", "a": "дентином", "num": 264}, {"q": "Прочитайте текст и запишите ответ\nЧерез 6-8 часов серозный экссудат переходит в _____________", "a": "гнойный", "num": 265}, {"q": "Прочитайте текст и запишите ответ\nГрануляционная ткань врастает в кариозную полость и образует _________пульпы.", "a": "полип", "num": 266}, {"q": "Прочитайте текст и запишите ответ\n______ - комплекс тканей, находящихся внутри зуба, включающий пульпу и дентин", "a": "эндодонт", "num": 267}, {"q": "Установите соответствие классификации заболеваний пародонта и их характеристик\nЗаболевание | Характеристика\n1. Гингивит | А. Воспаление десны без нарушения зубодесневого соединения\n2. Пародонтит | Б. Деструкция костной ткани с образованием карманов\n3. Пародонтоз | В. Системная дистрофия тканей пародонта без воспаления\n4. Пародонтома | Г. Опухолеподобные образования пародонта\n5. Идиопатическое заболевание | Д. Прогрессирующий лизис тканей неясной этиологии", "a": "А-1, Б-2, В-3, Г-4, Д-5", "num": 268}, {"q": "Установите соответствие препаратов и их применения в пародонтологии\nПрепарат | Применение\n1. Хлоргексидин 0,05% | А. Антисептическая обработка карманов\n2. Метронидазол гель | Б. Местное лечение анаэробной инфекции\n3. Солкосерил дентальный | В. Стимуляция заживления после операций\n4. Доксициклин | Г. Системная антибактериальная терапия\n5. Гидрокортизоновая мазь | Д. Купирование воспаления при гингивите", "a": "А-1, Б-2, В-3, Г-4, Д-5", "num": 269}, {"q": "Выберите один вариант ответа\nКомплекс тканей, объединенных понятием пародонт:\nА. десна и круговая связка зуба\nБ. периодонт, десна, надкостница, зуб\nВ. десна, надкостница, кость альвеолы, периодонт, ткани зуба\nГ. десна, ткани зуба (цемент)\nД. десна, надкостница, цемент", "a": "Д", "num": 270}, {"q": "Выберите один вариант ответа\nКритерий выбора метода хирургического лечения пародонтита:\nА. жалобы пациента\nБ. длительность заболевания\nВ. кровоточивость десны при чистке зубов\nГ. глубина пародонтального кармана\nД. степень подвижности зубов", "a": "Г", "num": 271}, {"q": "Выберите один вариант ответа\nПародонтоз по клиническому течению различают:\nА. острый.\nБ. хронический.\nВ. хронический в стадии обострения.\nГ. в стадии ремиссии", "a": "Б", "num": 272}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nДля снятия зубных отложений используют\nА. ультразвуковой сканер\nБ. рашпили\nВ. экскаваторы\nГ. гладилки", "a": "А, В", "num": 273}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nКакие препараты используются для местного лечения пародонтита?\nА. 0,05% раствор хлоргексидина\nБ. Амоксициллин в таблетках\nВ. Метронидазол (гель)\nГ. Диоксидин (в виде аппликаций)\nД. Ибупрофен (системно)", "a": "А, В, Г", "num": 274}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nКакие факторы риска способствуют развитию агрессивного пародонтита?\nА. Генетическая предрасположенность\nБ. Нарушение функции нейтрофилов\nВ. Употребление твердой пищи\nГ. Курение\nД. Частое использование зубной нити", "a": "А, Б, Г", "num": 275}, {"q": "По материалу изготовления боры бывают.\nА. шаровидные\nБ. твердосплавные\nВ. фиссурные\nГ. механические", "a": "Б", "num": 277}, {"q": "При пломбировании кариозных полостей методом «закрытого сэндвича» прокладка.\nА. перекрывается композитом\nБ. не перекрывается композитом\nВ. не используется\nГ. накладывается на края полости", "a": "А", "num": 278}, {"q": "Выберите один вариант ответа\nКлассификация кариеса зубов в зависимости от последовательности возникновения:\nА. первичный, вторичный;\nБ. компенсированная форма, субкомпенсированная форма;\nВ. циркулярный, апроксимальный.\nГ. пришеечный, кариес корня", "a": "А", "num": 279}, {"q": "Выберите один вариант ответа\nМетоды диагностики кариеса в стадии белого пятна основаны:\nА. на стабильности эмали\nБ. на уменьшении проницаемости эмали\nВ. на увеличении проницаемости эмали\nГ. на изменении оптических свойств эмали", "a": "В", "num": 280}, {"q": "Выберите один вариант ответа\nПолость при глубоком кариесе локализуется в пределах:\nА. эмали;\nБ. эмали и дентина;\nВ. эмали, дентина и предентина.\nГ. дентина и предентина.", "a": "В", "num": 281}, {"q": "В основу классификации кариозных полостей по Блэку положены признаки:\nА. гистологические\nБ. клинические\nВ. анатомо-топографические\nГ. топографические\nД. клинико-топографические", "a": "В", "num": 282}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nПри глубоком кариесе больной жалуется на:\nА. боль от температурных раздражителей;\nБ. самопроизвольные, ночные боли;\nВ. боль от механических раздражителей;\nГ. кратковременные боли от химических раздражителей;\nД. боль при накусывании", "a": "А, В", "num": 283}, {"q": "Прочитайте текст, и выберите несколько вариантов ответа\nПри поверхностном кариесе больной жалуется на:\nА. боль от кислого;\nБ. боль от сладкого;\nВ. боль от холодного;\nГ. ночные боли;\nД. приступообразные боли.", "a": "А, Б", "num": 284}, {"q": "Средний кариес декомпенсированной формы с начавшейся резорбцией корней пломбируют\n1. в 1 посещение.\n2. в 2 посещения.\n3. в 3 посещения.\n4. отсроченное пломбирование с применением лечебной пасты.\n5. отсроченное пломбирование с применением кортикостероидов.", "a": "1", "num": 285}, {"q": "Установить в правильной последовательности этапы подготовки и пломбирования кариозных полостей при лечении глубокого кариеса:\n1. препарирование кариозной полости\n2. медикаментозная обработка и высушивание полости\n3. изоляция кариозной полости от слюны\n4. наложение лечебной и изолирующей прокладок\n5. наложение постоянной пломбы, шлифовка, полировка", "a": "1, 3, 2, 4, 5", "num": 286}, {"q": "Установите правильную последовательность действий врача-стоматолога при оказании неотложной помощи пациенту с развивающимся ангионевротическим отеком Квинке (отеком гортани) в стоматологическом кабинете:\n1. Немедленное прекращение всех манипуляций и вызов бригады скорой медицинской помощи.\n2. Обеспечение доступа свежего воздуха, расстегнуть стесняющую одежду.\n3. Введение антигистаминных препаратов парентерально (например, Супрастин).\n4. Введение глюкокортикостероидов внутримышечно или внутривенно (например, Преднизолон).\n5. Подготовка к проведению коникотомии в случае нарастания асфиксии.", "a": "1 → 2 → 3 → 4 → 5", "num": 287}, {"q": "Установите правильную последовательность местного лечения пациента с острой псевдомембранозной кандидозной инфекцией (молочницей) полости рта:\n1. Промывание полости рта растворами щелочей и антисептиков (например, 2% раствором натрия гидрокарбоната) для механического удаления налета.\n2. Обработка слизистой оболочки противогрибковыми препаратами местного действия (например, нистатиновая мазь, клотримазол крем).\n3. Отмена ранее принимаемых (если возможно) антибиотиков или кортикостероидов, спровоцировавших кандидоз.\n4. Назначение противогрибковых препаратов системного действия (например, флуконазол) при неэффективности местной терапии или тяжелом течении.\n5. Обучение пациента гигиене полости рта и зубных протезов для профилактики рецидивов.", "a": "3 → 1 → 2 → 4 → 5", "num": 288}, {"q": "Инфекционное заболевание человека, которое вызывается микобактерией Ганзена-Нейссера. Приведите классификацию данной патологии\n1. туберкулез\n2. лепра\n3. ВИЧ\n4. сифилис", "a": "2", "num": 289}, {"q": "Заболевание, проявляющееся ограниченным, медленно увеличивающимся пятнисто-узелковым поражением слизистой от 1 см в диаметре и больше с гиперемированной поверхностью, гладкая или бархатистая – с мелкими сосочковыми разрастаниями, называется…\nЧем опасно данное заболевание?\n1. болезнью Боуэна\n2. абразивным преканцерозным хейлитом Манганотти\n3. лейкоплакией эрозивной\n4. эрозивно-язвенной формой КПЛ", "a": "1", "num": 290}, {"q": "Многослойный плоский эпителий слизистой оболочки полости рта в норме ороговевает на…\nНазовите тип слизистой оболочки, покрывающий данное анатомическое образование\n1. мягком небе\n2. дне полости рта\n3. щеках\n4. твердом небе", "a": "4", "num": 291}, {"q": "Наиболее эффективный метод лечения ретенционных кист малых слюнных желез.\n1. цистотомия;\n2. криотерапия;\n3. склерозирование;\n4. цистаденэктомия", "a": "4", "num": 292}, {"q": "Тактика стоматолога при проталкивании корня в нижнечелюстной канал:\n1. извлечь корень через лунку\n2. оставить корень в канале\n3. извлечь корень через созданное \"окно\" в наружной кортикальной пластинке", "a": "3", "num": 293}, {"q": "Для аппликационного обезболивания слизистой оболочки полости рта применяют:\nа) 1% раствор новокаина\nб) 10% спрей лидокаина\nв) 10% взвесь анестезина в масле\nг) 0,1% взвесь анестезина в масле\nд) 5% взвесь анестезина в глицерине.", "a": "а", "num": 294}, {"q": "Показанием к удалению зуба является\nа) острый пульпит\nб) глубокий кариес\nв) острый периодонтит\nг) хронический гранулематозный периодонтит", "a": "г", "num": 295}, {"q": "S-образными щипцами без шипов удаляют\nа) корни зубов\nб) моляры нижней челюсти\nв) моляры верхней челюсти\nг) премоляры верхней челюсти\nд) третьи моляры нижней челюсти", "a": "г", "num": 296}, {"q": "На нижней челюсти элеваторами под углом удаляют\nа) клыки\nб) резцы\nв) премоляры\nг) корни моляров", "a": "г", "num": 297}, {"q": "Для удаления корней резцов верхней челюсти предназначены щипцы\nа) клювовидные сходящиеся\nб) штыковидные\nв) S-образные сходящиеся\nг) S-образные - шип справа\nд) S-образные несходящиеся", "a": "б", "num": 298}, {"q": "К лоскутным операциям на пародонте относятся следующие методы\nа) кюретаж\nб) гингивотомия\nв) операция по Мюллеру\nг) операция по Кларку\nд) операция по Киселеву", "a": "д", "num": 299}, {"q": "\"Причинный\" зуб при остром одонтогенном остеомиелите необходимо\nа) удалить\nб) раскрыть\nв) запломбировать\nг) депульпировать\nд) реплантировать", "a": "а", "num": 300}, {"q": "Прочитайте текст, укажите правильный ответ и запишите\nВыраженное затруднение при открывании рта появляется у больных с флегмоной в области:\n1) скуловой\n2) поднижнечелюстной\n3) подглазничной\n4) щечной области\n5) околоушно-жевательной", "a": "5", "num": 302}, {"q": "Прочитайте текст, укажите правильный ответ\nСерьезным осложнением флегмон верхних отделов лица является:\n1) паротит\n2) медиастинит\n3) парез лицевого нерва\n4) гематома мягких тканей\n5) тромбоз кавернозного синуса головного мозга", "a": "5", "num": 303}, {"q": "Прочитайте текст, укажите правильный ответ\nПервичный очаг гнойного воспаления, перерастающий во флегмону дна полости рта, локализуется в:\n1) щечной области\n2) подвисочной ямке\n3) жевательной мышце\n4) околоушной слюнной железе\n5) поднижнечелюстной области", "a": "5", "num": 304}, {"q": "Выбор метода восстановительной операции опpеделяется:\n1. по размерам дефекта или деформации\n2. по специальному оснащению операционной\n3. по мнению больного", "a": "Ответ: 1", "num": 305}, {"q": "Пластику встречными треугольными лоскутами по Лимбергу используют:\n1. при рубцовых выворотах век\n2. при линейных келлоидных рубцах\n3. при обширных дефектах костей лица", "a": "1", "num": 306}, {"q": "5.Прочитайте текст, укажите правильный ответ\nКакую шину рекомендуется использовать при двойном переломе тела нижней челюсти со смещением у ребенка 7 лет. Как определить, что шину можно снимать?\n1. Шину-моноблок на область жевательных зубов справа;\n2. Комбинированную пластмассовую зубонадесневую шину с зацепными петлями на обе челюсти с межчелюстной фиксацией;\n3. Проволочные шины с зацепными петлями на обе челюсти с межчелюстной фиксацией;\n4. Гладкую шину-скобу.", "a": "2", "num": 308}, {"q": ".Прочитайте текст, укажите правильный ответ\nДля первично-хронического гиперпластического остеомиелита челюстных костей у детей характерны следующие клинико-рентгенологические симптомы. Назовите возможные исходы заболевания.\n1. Увеличение объема кости;\n2. Хронический гранулирующий периодонтит интактного зуба (зубов) (R-гр);\n3. Гибель зачатков (R-гр);\n4. Крупный секвестр (R-гр);", "a": "1", "num": 309}, {"q": "Прочитайте текст, укажите правильный ответ\nУ детей, больных хроническим рецидивирующим паренхиматозным паротитом, в анамнезе я\n3) рационального протезирования", "a": "1", "num": 372}, {"q": "Соотнесите тип зуба с его ключевой отличительной особенностью\nТип зуба | Особенность\n1. Верхний центральный резец | А. Имеет выраженный небный бугорок и две борозды, отделяющие его от медиального и дистального краевых гребешков.\n2. Верхний клык | Б. Самый широкий зуб в вестибуло-оральном направлении по режущему краю среди резцов.\n3. Верхний первый премоляр | В. Имеет бугорок Карабелли на мезио-небной поверхности.\n4. Верхний первый моляр | Г. Имеет самый длинный и мощный корень, режущий край состоит из двух половин (мезиальной и дистальной)\nД. Жевательная поверхность имеет ромбовидную форму", "a": "1-Б, 2-Г, 3-А, 4-В", "num": 373}, {"q": "Соотнесите термин из цветоведения с его определением.\nТермин | Определение\n1. Опалесценция | А. Свойство материала светиться под воздействием ультрафиолетового излучения\n2. Флюоресценция | Б. Свойство материала изменять цвет в зависимости от угла падения и просмотра света\n3. Мамелоны | В. Способность материала рассеивать свет, создавая эффект внутреннего свечения или глубины\n4. Микрорельеф | Г. Вертикальные валики на вестибулярной поверхности нестертых резцов\nД. Естественные горизонтальные линии и неровности на поверхности эмали.", "a": "1-В, 2-А, 3-Г, 4-Д", "num": 374}, {"q": "Соотнесите этап прямой реставрации с его основным содержанием\nЭтап работы | Содержание этапа\n1. Препарирование | А. Воссоздание анатомической формы, контактов, рельефа\n2. Протравливание | Б. Удаление пораженных тканей и создание полости оптимальной формы для удержания материала\n3. Нанесение адгезива | В. Создание микропор в эмали для проникновения адгезива\n4. Моделирование | Г. Окончательное придание блеска и гладкости поверхности реставрации\n5. Полирование | Д. Нанесение праймера и бонда для образования гибридного слоя и связи с композитом", "a": "1-Б, 2-В, 3-Д, 4-А, 5-Г", "num": 375}, {"q": "Соотнесите инструмент с его основным назначением в процессе моделирования\nИнструме ухоли\n3. заболевание костной системы, поражающие их регенерационную способность\n4. бронхиальная астма", "a": "4", "num": 388}, {"q": "Прочитайте текст, укажите правильный ответ\nОссеоинтеграция имплантата – это… Перечислите другие типы интеграции имплантата.\n1. плотное укрепление имплантата\n2. помещение имплантата в костную ткань\n3. плотный контакт между новообразованной костной тканью и поверхностью имплантата\n4. наличие фиброзной ткани между имплантатом и костью", "a": "3", "num": 389}, {"q": "Прочитайте текст, укажите правильный\nЧто происходит с костной тканью при превышении температуры критических величин во время имплантации?\nМетоды профилактики перегрева кости\n1. гиперемия\n2. отек\n3. инфильтрация\n4. некроз", "a": "4", "num": 390}, {"q": "Выберите один вариант ответа\nНа современном этапе наиболее отвечающим всем требованиям для изготовления имплантатов материалом является:\n1) КХ сплав,\n2) титан и его сплавы,\n3) сплавы благородных металлов,\n4) керамика,\n5) ситаллы", "a": "2", "num": 391}, {"q": "Выберите один вариант ответа\nАбсолютным противопоказанием к дентальной имплантации является\n1) аномалии прикуса\n2) пародонтит\n3) беременность\n4) заболевания крови и кроветворных органов", "a": "4", "num": 392}, {"q": "Выберите один вариант ответа\nПредоперационная подготовка при дентальной имплантации включает\n1) пальпация слюнных желез\n2) пункцию верхнечелюстной пазухи\n3) лечение невралгии\n4) премедикацию", "a": "4", "num": 393}, {"q": "Выберите один вариант ответа\nПринцип использования мембраны и костного трансплантата:\n1) кость - костный трансплантат - мембрана - слизистый лоскут\n2) кость - мембрана - костный трансплантат - слизистый лоскут\n3) мембрана - кость - костный трансплантат - слизистый лоскут\n4) кость - костный трансплантат - слизистый лоскут - мембрана", "a": "1", "num": 394}, {"q": "Выберите один вариант ответа\nПрепарирование пилотным сверлом осуществляется до:\n1) мембраны Шнейдера\n2) на середину высоты кости\n3) до уровня за по Оксману для лечения ложного сустава является:\n1) Гантель\n2) Пружина\n3) Петли\n4) Крючки\nОпишите вид протеза по Оксману:", "a": "1", "num": 400}, {"q": "Прочитайте текст, укажите правильный ответ\nПричина формирования «ложного сустава»:\n1) Неправильное сопоставление костных отломков\n2) Неправильно сросшиеся переломы\n3) Нарушение гигиены полости рта\n4) Сильное кровотечение\nПеречислите методики ортопедического лечения:", "a": "2", "num": 401}, {"q": "Прочитайте текст, укажите правильный ответ\nСужение ротовой щели – это:\n1) адентия\n2) окклюзия\n3) микростомия\n4) прикус\nНазовите варианты съемного протезирования при данной патологии:", "a": "3", "num": 402}, {"q": "Установите правильную последовательность действий при изучении модели в параллелометре учении модели в параллелометре\n1) графитовым стержнем отметить клинический экватор\n2) на столике измерительного прибора установить нулевое положение модели\n3) определить глубину поднутрений\n4) зафиксировать модель с определенной межевой линией\n5) определить тип и место расположения кламмеров", "a": "2,1,4,3,5;", "num": 403}, {"q": "Выберите один вариант ответа\nПосле проведения последней коррекции бюгельного протеза пациенту необходимо рекомендовать являться в клинику для диспансерного осмотра\n1) один раз в месяц\n2) один раз в полгода\n3) один раз в год\n4) только при возникновении жалоб\n5) никогда", "a": "2", "num": 404}, {"q": "Выберите один вариант ответа\nКак располагается дуга бюгельного протеза на нижней челюсти, при отвесной форме альвеолярного гребня\n1) отстоит от слизистой на 0,8 мм\n2) подходит к слизистой оболочке почти вплотную\n3) отстоит от слизистой оболочки на 1,2 мм\n4) отстоит от слизистой на 0,5-1 мм\n5) отстоит от слизистой на 2 мм", "a": "4", "num": 405}, {"q": "Установите правильную последовательность клинических этапов изготовления бюгельных протезов\n1)проверка конструкции бюгельного протеза\n2)определение Ц.О\n3)получение оттисков\n4)наложение протеза\n5)проверка каркаса бюгельного протеза", "a": "3,2,5,1,4", "num": 406}, {"q": "Выберите один вариант ответа\nНаиболее эффективно использовать в качестве антиопрокидывателя в бюгельном протезе\n1) отростки базиса протеза\n2) пальцевые отростки\n3) многозвеньевые кламмеры\n4) непрерывные кламмеры\n5) передние нёбные дуги", "a": "3", "num": 407}, {"q": "Выберите один вариант ответа\nЭтиология приобретенных дефектов твердого и мягкого неба\n1) пороки развития челюстно-лицевой области\n2) огнестрельная рана\n3) механическая травма\n4) травматическое удаление зуба\n5) после удаления новообразований\n6 ) вредные привычки\n7) неправильно изготовленные зубные протезы", "a": "3", "num": 408}, {"q": "Выберите несколько вариантов ответа\nНарушения, связанные с приобретенными дефектами твердого и мягкого неба\n1) нарушение функции жевания\n2) нарушение функции глотания\n3) нарушение функции речи\n4) нарушение эстетики\n5) нарушение смыкания губ\n6) склонность к заболеваниям уха, горла, носа\n7) нарушение функции дыхания\n8) нарушение развития челюстей", "a": "1,2,3,4;", "num": 409}, {"q": "Выберите несколько вариантов ответа\nЗадачами ортопедического лечения дефектов твердого и мягкого неба являются\n1) разобщение полости рта и полости носа\n2) разобщение полости рта и носоглотки\n3) восстановление функций жевания, глотания, речи и дыхания\n4) поддержание мягких тканей, потерявших костную основу", "a": "1,3.4", "num": 410}, {"q": "Выберите один вариант ответа\nДля снятия оттиска при дефекте неба используют\n1) индивидуальные ложки\n2) стандартные ложки\n3) S-образный алюминиевый шпатель", "a": "3", "num": 411}, {"q": "Выберите один вариант ответа\nОБТУРАТОР – это\n1) зубной протез, покрывающий небо и фиксирующийся на зубах\n2) протез, закрывающий дефект широкой частью и фиксирующийся в расщелине на небных отростках узкой частью", "a": "2", "num": 412}, {"q": "Выберите один вариант ответа\nПри полном отсутствии зубов конструирование зубных рядов по ортогнатическому, прогеническому или прогнатическому типу обусловлено\n1) необходимостью увеличения окклюзионной поверхности.\n2) просьбой больного\n3) видом аппарата для конструирования зубных рядов (окклюдатор, артикулятор)\n4) видом соотношения челюстей больного\n5) степенью атрофии челюстей", "a": "4", "num": 413}, {"q": "Выберите один вариант ответа\nФормирователь десны – это\n1) заглушка имплантата,\n2) винт для фиксации супраструктуры,\n3) форма соответствующая полностью супраструктуре", "a": "3", "num": 414}, {"q": "Выберите один вариант ответа\nКоличество видов кламмеров в системе Ney\n1) 5\n2) 7\n3) 4", "a": "1", "num": 415}, {"q": "Выберите один вариант ответа\nСоединение кламмера с базисом протеза может быть\n1) Лабильное\n2) Полулабильное\n3) Жесткое\n4) Произвольное\n5) Правильные ответы 1,2,3", "a": "2", "num": 416}, {"q": "Выберите один вариант ответа\nПо функции кламмеры бывают\n1) Удерживающие\n2) Опирающиеся\n3) Опорно-удерживающие\n4) Все ответы правильные", "a": "3", "num": 417}, {"q": "Выберите один вариант ответа\nОдносторонний дистально неограниченный (концевой) дефект зубного ряда по классификации кеннеди относится к классу\nА) третьему\nБ) первому\nВ) второму\nГ) четвертому", "a": "В", "num": 418}, {"q": "Выберите один вариант ответа\nПри планировании изготовления несъемной конструкции недостаточное количество опорных зубов может привести к\nА) функциональной перегрузке пародонта опорных зубов\nБ) вертикальным деформациям зубных рядов\nВ) множественному кариесу\nГ) флюорозу эмали", "a": "А", "num": 419}, {"q": "Выберите один вариант ответа\nПри каком условии определяют центральную окклюзию\nА) наличие зубов антагонистов в 3-х функционально-ориентированных группах зубов\nБ) наличие зубов антагонистов в 2-х функционально-ориентированных группах зубов\nВ) наличие зубов антагонистов в одной функционально-ориентированной группе зубов\nГ) генерализованная горизонтальная форма повышенного стирания твердых тканей зубов, со снижением высоты нижнего отдела лица", "a": "А", "num": 420}, {"q": "Установите правильную последовательность стадий умирания:\nА) Агония\nБ) Клиническая смерть\nВ) Преагональное состояние\nГ) Биологическая смерть\nД) Терминальная пауза", "a": "Правильная последовательность: В -> Д -> А -> Б -> Г", "num": 425}, {"q": "Установите последовательность этапов судебно-медицинской идентификации личности по стоматологическому статусу:\nА) Сравнительное исследование прижизненных и посмертных данных\nБ) Описание стоматологического статуса неизвестного трупа\nВ) Формулировка выводов о тождестве или его отсутствии\nГ) Сбор прижизненных стоматологических сведений (амбулаторная карта, рентгенограммы)\nД) Раздельное исследование признаков", "a": "Правильная последовательность: Б -> Г -> А -> Д -> В", "num": 426}, {"q": "Врач-стоматолог может быть привлечен в качестве эксперта-специалиста для участия в осмотре трупа на месте происшествия в первую очередь для:\nа) Проведения полного секционного исследования\nб) Констатации наступления смерти\nв) Описания повреждений челюстно-лицевой области и помощи в идентификации личности\nг) Изъятия внутренних органов для токсикологического исследования", "a": "В", "num": 427}, {"q": "Установите последовательность действий врача при наружном осмотре трупа на месте его обнаружения:\nА) Описание позы трупа и его одежды\nБ) Осмотр и описание трупных изменений (пятна, окоченение)\nВ) Фиксация расположения и описания повреждений на теле\nГ) Установление признаков, позволяющих опознать труп\nД) Изъятие вещественных доказательств биологического происхождения", "a": "Правильная последовательность: А -> Б -> В -> Г -> Д", "num": 428}, {"q": "Объекты биологического происхождения при производстве экспертизы изымает:\nа) лицо, производящее дознание\nб) следователь\nв) прокурор\nг) судебно-медицинский эксперт\nд) судья", "a": "Б", "num": 429}, {"q": "Боль при хроническом пульпите после воздействия раздражителя (холода):\nа) быстро проходит после воздействия,\nб) задерживается несколько секунд,\nв) задерживается в течение минуты,\nг) сразу не возникает", "a": "г", "num": 433}, {"q": ".Обострение хронического гранулирующего периодонтита чаще всего соответствует диагнозу по МКБ-10:\nа) периапикальный абсцесс без свища,\nб) периапикальный абсцесс со свищом,\nв) острый апикальный периодонтит", "a": "б", "num": 434}, {"q": "Непереносимость металлических ортопедических материалов обусловлена:\nа) заболеваниями пищеварительной системы у пациента,\nб) неудовлетворённостью пациента видом протеза,\nв) возникновением коррозийных процессов металла в ротовой жидкости", "a": "в", "num": 435}, {"q": "Выберите один вариант ответа\nОсновным объектом судебно-стоматологической экспертизы является:\nа) Лечение зубов при жизни.\nб) Установление профессиональных ошибок стоматолога.\nв) Челюстно-лицевая область человека (живого, трупа, его останков, вещественных доказательств).\nг) Изучение стоматологического здоровья населения", "a": "в", "num": 436}, {"q": "Выберите один вариант ответа\nКакое из перечисленных идентификационных свойств зубов является наиболее устойчивым и ценным для идентификации личности?\nа) Цвет эмали.\nб) Наличие кариозных полостей.\nв) Форма и размер зубных рядов, особенности анатомии зубов, одонтоскопические признаки.\nг) Степень стираемости коронок.", "a": "в", "num": 437}, {"q": "Выберите один вариант ответа\nПри осмотре трупа на месте происшествия стоматолог-эксперт НЕ обязан:\nа) Описать видимые повреждения челюстно-лицевой области.\nб) Провести предварительную оценку стоматологического статуса для идентификации.\nв) Немедленно удалить зубы для последующей дактилоскопии.\nг) Указать наличие или отсутствие зубных протезов", "a": "в", "num": 438}, {"q": "Выберите один вариант ответа\n«Стоматологический портрет» — это:\nа) Художественный портрет человека, сделанный стоматологом.\nб) Систематизированное описание признаков зубной системы, зубных рядов и особенностей полости рта для регистрации и идентификации.\nв) Описание внешности человека только по улыбке.\nг) Рентгеновский снимок всех зубов.", "a": "б", "num": 439}, {"q": "Выберите один вариант ответа\nВозраст ребенка по состоянию зубной системы определяется с наибольшей точностью на основе:\nа) Степени стертости молочных зубов.\nб) Состояния гигиены полости рта.\nв) Сочетания данных прорезывания временных и постоянных зубов и рентгенологического исследования формирования корней.\nг) Количества запломбированных зубов.", "a": "в", "num": 440}, {"q": "Какие из перечисленных объектов могут быть направлены на судебно-стоматологическую экспертизу для идентификации личности? (Выберите три правильных ответа)\nа) Изолированный зуб, найденный на месте пожара.\nб) Слепки челюстей, хранящиеся в стоматологической поликлинике.\nв) Фотография улыбки при жизни.\nг) Частичная съемная пластиночная челюсть, извлеченная из водоема вместе с телом.\nд) Образец слюны для установления отцовства", "a": "а, б, г", "num": 441}, {"q": "Признаками прижизненности повреждений челюстно-лицевой области являются: (Выберите два правильных ответа)\nа) Отсутствие кровоизлияний в мягкие ткани по краям раны.\nб) Наличие свертков крови в раневом канале.\nв) Наличие признаков заживления (грануляции, эпителизация).\nг) Бледность и сухость краев раны.", "a": "б, в", "num": 442}, {"q": "В задачи судебно-стоматологической экспертизы при расследовании дел о профессиональных правонарушениях медицинских работников входит: (Выберите три правильных ответа)\nа) Установление вины пациента в осложнениях.\nб) Оценка качества и объема оказанной стоматологической помощи.\nв) Определение причинно-следственной связи между действиями врача и наступившими последствиями.\nг) Расчет стоимости неудачного лечения.\nд) Выявление дефектов лечения на основе анализа медицинской документации и состояния пациента.", "a": "б, в, д", "num": 443}, {"q": "Установите соответствие между видом исследования и его основной целью в судебной стоматологии:\n1. Одонтоскопия | А. Сравнение прижизненных и посмертных изображений зубов и лица.\n2. Одонтометрия | Б. Изучение и описание ан const BLOCK_SIZE = 30;

let activeQuestions = [];
let idx = 0;

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ---------- Анализ вопроса ----------
function analyze(q) {
    const lines = q.split('\n').map(l => l.trim()).filter(Boolean);

    const matchCandidates = [];
    for (const line of lines) {
        const parts = line.split('|').map(p => p.trim());
        if (parts.length === 4 &&
            parts[0].length > 0 && parts[0].length <= 4 &&
            parts[2].length > 0 && parts[2].length <= 4) {
            matchCandidates.push([parts[0], parts[1], parts[2], parts[3]]);
        }
    }
    if (matchCandidates.length >= 2) {
        const lefts = [], seenL = new Set();
        const rights = {}, seenR = new Set();
        for (const [a, at, b, bt] of matchCandidates) {
            if (!seenL.has(a)) { lefts.push({key: a, text: at}); seenL.add(a); }
            if (!seenR.has(b)) { rights[b] = bt; seenR.add(b); }
        }
        if (lefts.length >= 2 && Object.keys(rights).length >= 2) {
            return {type: 'matching', lefts, rights};
        }
    }

    const re = /^([А-Яа-яA-Za-z]|\d+)\s*[.)]\s+(.+)$/gm;
    const raw = [];
    let m;
    while ((m = re.exec(q)) !== null) {
        raw.push([m[1], m[2].trim()]);
    }
    const options = [], seen = new Set();
    for (const [k, t] of raw) {
        const key = k.toUpperCase();
        if (!seen.has(key)) { options.push({key: key, text: t}); seen.add(key); }
    }

    if (options.length >= 2) {
        if (/(последовательность|порядок|этапы|стадии|расположите|расположить)/i.test(q) &&
            !/(несколько|два правильных|три правильных)/i.test(q)) {
            return {type: 'sequence', options: options};
        }
        const multi = /(несколько|два правильных|три правильных|два ответа|три ответа|два варианта|три варианта)/i.test(q);
        return {type: 'choice', options: options, multi: multi};
    }

    return {type: 'text'};
}

function extractCorrectKeys(answerText, optionKeys) {
    const keys = new Set(optionKeys.map(k => k.toUpperCase()));
    const correct = [], seen = new Set();
    const tokens = answerText.split(/[^А-Яа-яA-Za-z0-9]+/).filter(Boolean);
    for (let t of tokens) {
        const up = t.toUpperCase();
        if (keys.has(up) && !seen.has(up)) { correct.push(up); seen.add(up); }
    }
    return correct;
}

function extractMatchingCorrect(answerText, leftKeys, rightKeys) {
    const leftSet = new Set(leftKeys.map(k => k.toUpperCase()));
    const rightSet = new Set(rightKeys.map(k => k.toUpperCase()));
    const map = {};

    const pairRe = /([А-ЯA-Zа-яa-z0-9]+)\s*[-\u2013\u2014]\s*([А-ЯA-Zа-яa-z0-9]+)/g;
    let m;
    while ((m = pairRe.exec(answerText)) !== null) {
        const a = m[1].toUpperCase();
        const b = m[2].toUpperCase();
        if (leftSet.has(a) && rightSet.has(b)) map[a] = b;
        else if (rightSet.has(a) && leftSet.has(b)) map[b] = a;
    }
    if (Object.keys(map).length >= 2) return map;

    const lines = answerText.split(/\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length >= 2) {
        const keysL = lines[0].split('|').map(s => s.trim()).filter(Boolean);
        const valsL = lines[1].split('|').map(s => s.trim()).filter(Boolean);
        if (keysL.length === valsL.length && keysL.length >= 2) {
            for (let i = 0; i < keysL.length; i++) {
                const k = keysL[i].toUpperCase();
                const v = valsL[i].toUpperCase();
                if (leftSet.has(k) && rightSet.has(v)) map[k] = v;
                else if (rightSet.has(k) && leftSet.has(v)) map[v] = k;
            }
        }
    }
    return map;
}

function normalizeText(s) {
    return s.toLowerCase().replace(/\s+/g, ' ').replace(/[.,;:!?"«»()\-–—]/g, '').trim();
}

function looseMatch(user, correct) {
    const u = normalizeText(user);
    const c = normalizeText(correct);
    if (u === c) return true;
    const uNums = (u.match(/\d+/g) || []).sort().join(',');
    const cNums = (c.match(/\d+/g) || []).sort().join(',');
    const uLets = (u.match(/[а-яa-z]/g) || []).sort().join(',');
    const cLets = (c.match(/[а-яa-z]/g) || []).sort().join(',');
    if ((uNums || uLets) && uNums === cNums && uLets === cLets) return true;
    const uDigits = u.match(/\d+/g);
    const cDigits = c.match(/\d+/g);
    if (uDigits && cDigits) {
        const us = new Set(uDigits), cs = new Set(cDigits);
        if (us.size === cs.size && [...us].every(x => cs.has(x))) return true;
    }
    return false;
}

        for (const rk of sortedRights) {

        ).join('');

        headType = 'Ввод ответа';
        const isLong = item.a.length > 40 || item.q.length > 200;
        if (isLong) {
            body = '<textarea class="text-input" id="textInput" placeholder="Введите ответ..."></textarea>';
        } else {
            body = '<input class="text-input" id="textInput" placeholder="Введите ответ...">';
        }
    }

    root.innerHTML =
        '<div class="card">' +
            '<div class="q-head">Вопрос ' + (idx + 1) + ' из ' + activeQuestions.length +
                ' · ' + headType + '</div>' +
            '<div class="q-text">' + escapeHtml(item.q) + '</div>' +
            body +
            '<div class="feedback" id="fb"></div>' +
            '<div class="nav">' +
                '<button class="nav-btn btn-secondary" id="skipBtn">Пропустить</button>' +
                '<button class="nav-btn btn-primary" id="checkBtn">Проверить</button>' +
                '<button class="nav-btn btn-primary" id="nextBtn" style="display:none">Дальше →</button>' +
            '</div>' +
        '</div>';

    if (info.type === 'choice') {
        root.querySelectorAll('.option').forEach(el => {
            el.addEventListener('click', (e) => {
                if (answered) return;
                const inp = el.querySelector('input');
                if (inp.type === 'radio') {
                    root.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                    inp.checked = true;
                    el.classList.add('selected');
                } else {
                    e.preventDefault();
                    inp.checked = !inp.checked;
                    el.classList.toggle('selected', inp.checked);
                }
            });
        });
    }

    document.getElementById('checkBtn').addEventListener('click', check);
    document.getElementById('skipBtn').addEventListener('click', () => { idx++; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => { idx++; render(); });
    updateProgress();
}

function check() {
    if (answered) return;
    const info = currentInfo;
    const item = activeQuestions[idx];
    const fb = document.getElementById('fb');
    let ok = false;
    let correctDisplay = item.a;

    if (info.type === 'choice') {
        const selected = [...document.querySelectorAll('.option input:checked')].map(i => i.value);
        const correct = extractCorrectKeys(item.a, info.options.map(o => o.key));
        const selSet = new Set(selected), corSet = new Set(correct);
        ok = selected.length === correct.length && selected.every(s => corSet.has(s));
        document.querySelectorAll('.option').forEach(el => {
            const k = el.dataset.key;
            if (corSet.has(k)) el.classList.add('correct');
            else if (selSet.has(k)) el.classList.add('wrong');
        });

    } else if (info.type === 'matching') {
        const correctMap = extractMatchingCorrect(
            item.a,
            info.lefts.map(l => l.key),
            Object.keys(info.rights)
        );
        let allOk = true, anySelected = false;
        document.querySelectorAll('.match-select').forEach(sel => {
            const k = sel.dataset.key.toUpperCase();
            const userVal = (sel.value || '').toUpperCase();
            const corVal = (correctMap[k] || '').toUpperCase();
            if (userVal && userVal === corVal) sel.classList.add('correct');
            else { sel.classList.add('wrong'); allOk = false; }
            if (userVal) anySelected = true;
        });
        ok = allOk && anySelected;

    } else {
        const input = document.getElementById('textInput');
        ok = looseMatch(input.value, item.a);
        input.disabled = true;
        input.style.borderColor = ok ? '#22a06b' : '#d9534f';
        input.style.background = ok ? '#e8f7f0' : '#fceceb';
    }

    if (ok) score++;
    answered = true;
    fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = ok
        ? '<b>✓ Верно!</b>'
        : '<b>✗ Неверно.</b>\nПравильный ответ: ' + escapeHtml(correctDisplay);

    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('skipBtn').style.display = 'none';
    updateProgress();
}

function updateProgress() {
    document.getElementById('bar').style.width =
        (idx / activeQuestions.length * 100) + '%';
    document.getElementById('counter').textContent =
        'Вопрос ' + (idx + 1) + ' из ' + activeQuestions.length;
    document.getElementById('score').textContent = 'Правильно: ' + score;
}

function restart() {
    activeQuestions = shuffle(activeQuestions);
    idx = 0;
    score = 0;
    render();
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

showMenu();
</script>
</body>
</html>
